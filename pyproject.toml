[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501", 
    "ANN001",
    "ARG002", 
    "ANN204",   # Missing return type annotation for special method `__init__`
    "N812", 
    "ANN201", 
    "D", 
    "T201", 
    "ERA001",
    "S101",     # Use of `assert` detected
    "PLR0913",  # Too many arguments in function definition (7 > 5)
    "N803",     # Argument name `X` should be lowercase
    "N806",     # Variable `X_train` in function should be lowercase
    "N816",     # Variable `epiUnc` in global scope should not be mixedCase
    "C901",     #  `__init__` is too complex (11 > 10)
    "PD901",    # Avoid using the generic variable name `df` for DataFrames
    "PD002",    # `inplace=True` should be avoided; it has inconsistent behavior
    "PLR2004",  # Magic value used in comparison, consider replacing `5` with a constant variable
    "PT018",    # Assertion should be broken down into multiple parts
    "PD011",    # Use `.to_numpy()` instead of `.values`
    "COM812",   # Checks for the absence of trailing commas.
    "ISC001",   # Checks for implicitly concatenated strings on a single line.
    "NPY002",    # Checks for the use of legacy np.random function calls.
    "PLR0912",
    "PLR0915",
    ]
